[project]
name = "deskfleet"
version = "0.1.0"
description = "Multi-agent customer-support triage service"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "langchain>=0.2",
    "langchain-classic>=1.0",
    "langchain-core>=0.2",
    "langchain-openai>=0.1",
    "langgraph>=0.1",
    "langsmith>=0.1",
    "psycopg[binary]>=3.1",
    "prometheus-client>=0.20",
    "tiktoken>=0.7",
]

[project.optional-dependencies]
ui = ["streamlit>=1.36"]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deskfleet"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers -m 'not integration'"
markers = [
    "integration: hits a real provider; run on main/nightly only",
]
