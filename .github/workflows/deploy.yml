name: DeskFleet CI/CD

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: deskfleet-${{ github.workflow }}-${{ github.ref }}
  # Never cancel a run that is mid-`gcloud run deploy`; a half-applied revision is worse than a queue.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  API_SERVICE_NAME: deskfleet-api
  MOCK_SERVICE_NAME: deskfleet-mockapi
  STREAMLIT_SERVICE_NAME: deskfleet-web
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: ${{ secrets.GCP_REGION }}
  REPOSITORY: ${{ secrets.GCP_ARTIFACT_REGISTRY_REPOSITORY }}
  SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}
  WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
  IMAGE_ROOT: ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.GCP_ARTIFACT_REGISTRY_REPOSITORY }}
  #: Secret Manager names for the values Cloud Run reads at runtime. Created once, out of band.
  RUNTIME_SECRETS: DATABASE_URL OPENAI_API_KEY API_KEY LANGCHAIN_API_KEY GROQ_API_KEY GRAFANA_CLOUD_PROM_URL GRAFANA_CLOUD_PROM_USER GRAFANA_CLOUD_PROM_KEY

jobs:
  validate:
    name: Lint and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: python -m pip install --upgrade pip uv

      - name: Restore uv cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ env.PYTHON_VERSION }}-${{ hashFiles('uv.lock') }}
          restore-keys: uv-${{ runner.os }}-${{ env.PYTHON_VERSION }}-

      - name: Sync environment
        run: uv sync --frozen --dev

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Test
        run: uv run pytest tests/unit tests/safety tests/prompts

  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build and push images
        run: |
          set -euo pipefail

          docker build -f deploy/Dockerfile.mockapi -t "${IMAGE_ROOT}/${MOCK_SERVICE_NAME}:${GITHUB_SHA}" .
          docker push "${IMAGE_ROOT}/${MOCK_SERVICE_NAME}:${GITHUB_SHA}"

          docker build -f deploy/Dockerfile.api -t "${IMAGE_ROOT}/${API_SERVICE_NAME}:${GITHUB_SHA}" .
          docker push "${IMAGE_ROOT}/${API_SERVICE_NAME}:${GITHUB_SHA}"

          docker build -f deploy/Dockerfile.streamlit -t "${IMAGE_ROOT}/${STREAMLIT_SERVICE_NAME}:${GITHUB_SHA}" .
          docker push "${IMAGE_ROOT}/${STREAMLIT_SERVICE_NAME}:${GITHUB_SHA}"

      - name: Publish secrets to Secret Manager
        id: secrets
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          API_KEY: ${{ secrets.API_KEY }}
          LANGCHAIN_API_KEY: ${{ secrets.LANGCHAIN_API_KEY }}
          GRAFANA_CLOUD_PROM_URL: ${{ secrets.GRAFANA_CLOUD_PROM_URL }}
          GRAFANA_CLOUD_PROM_USER: ${{ secrets.GRAFANA_CLOUD_PROM_USER }}
          GRAFANA_CLOUD_PROM_KEY: ${{ secrets.GRAFANA_CLOUD_PROM_KEY }}
        run: |
          set -euo pipefail

          # Values move over a pipe into --data-file=-, so no secret reaches a command line, an
          # `env` dump or the Cloud Run revision spec. The secrets themselves are created once by
          # hand (see the README) so this job needs only secretVersionAdder, never admin.
          pairs=()
          for name in ${RUNTIME_SECRETS}; do
            value="${!name}"
            if [ -z "${value}" ]; then
              echo "skipping ${name}: not set as a repository secret"
              continue
            fi
            if ! gcloud secrets describe "${name}" --project "${PROJECT_ID}" >/dev/null 2>&1; then
              echo "::error::Secret Manager has no secret named ${name}. Create it once with:" \
                   "gcloud secrets create ${name} --project ${PROJECT_ID} --replication-policy automatic"
              exit 1
            fi
            printf '%s' "${value}" |
              gcloud secrets versions add "${name}" --project "${PROJECT_ID}" --data-file=- >/dev/null
            echo "published ${name}"
            pairs+=("${name}=${name}:latest")
          done

          printf 'set_secrets=%s\n' "$(IFS=,; echo "${pairs[*]}")" >> "${GITHUB_OUTPUT}"

      - name: Deploy to Cloud Run
        id: run_deploy
        env:
          SET_SECRETS: ${{ steps.secrets.outputs.set_secrets }}
        run: |
          set -euo pipefail

          # The mock deploys first so the api's ORDER_API_BASE_URL points at a service that exists.
          gcloud run deploy "${MOCK_SERVICE_NAME}" \
            --project "${PROJECT_ID}" \
            --region "${REGION}" \
            --image "${IMAGE_ROOT}/${MOCK_SERVICE_NAME}:${GITHUB_SHA}" \
            --service-account "${SERVICE_ACCOUNT}" \
            --allow-unauthenticated \
            --port 8081 \
            --min-instances 0 \
            --memory 512Mi \
            --timeout 300 \
            --set-env-vars "LOG_LEVEL=INFO"

          mock_url="$(gcloud run services describe "${MOCK_SERVICE_NAME}" \
            --project "${PROJECT_ID}" \
            --region "${REGION}" \
            --format='value(status.url)')"

          # gcloud rejects an empty --set-secrets, so an all-unset configuration must omit the flag
          # rather than deploy a service that cannot read a single secret.
          secret_flag=()
          if [ -n "${SET_SECRETS}" ]; then
            secret_flag=(--set-secrets "${SET_SECRETS}")
          fi

          # ^@^ swaps the delimiter off the comma: a DATABASE_URL or URL holding one would
          # otherwise be read as the start of the next variable.
          gcloud run deploy "${API_SERVICE_NAME}" \
            --project "${PROJECT_ID}" \
            --region "${REGION}" \
            --image "${IMAGE_ROOT}/${API_SERVICE_NAME}:${GITHUB_SHA}" \
            --service-account "${SERVICE_ACCOUNT}" \
            --allow-unauthenticated \
            --port 8080 \
            --min-instances 0 \
            --memory 1Gi \
            --timeout 300 \
            "${secret_flag[@]}" \
            --set-env-vars "^@^ORDER_API_BASE_URL=${mock_url}@PRODUCT_API_BASE_URL=${mock_url}@LANGCHAIN_TRACING_V2=true@LANGCHAIN_ENDPOINT=https://aws.api.smith.langchain.com@LANGCHAIN_PROJECT=deskfleet@LOG_LEVEL=INFO"

          api_url="$(gcloud run services describe "${API_SERVICE_NAME}" \
            --project "${PROJECT_ID}" \
            --region "${REGION}" \
            --format='value(status.url)')"

          gcloud run deploy "${STREAMLIT_SERVICE_NAME}" \
            --project "${PROJECT_ID}" \
            --region "${REGION}" \
            --image "${IMAGE_ROOT}/${STREAMLIT_SERVICE_NAME}:${GITHUB_SHA}" \
            --service-account "${SERVICE_ACCOUNT}" \
            --allow-unauthenticated \
            --port 8501 \
            --min-instances 0 \
            --memory 512Mi \
            --timeout 300 \
            --set-env-vars "^@^API_BASE_URL=${api_url}@LOG_LEVEL=INFO"

          streamlit_url="$(gcloud run services describe "${STREAMLIT_SERVICE_NAME}" \
            --project "${PROJECT_ID}" \
            --region "${REGION}" \
            --format='value(status.url)')"

          printf 'streamlit_url=%s\n' "${streamlit_url}" >> "${GITHUB_OUTPUT}"
          printf 'api_url=%s\n' "${api_url}" >> "${GITHUB_OUTPUT}"

      - name: Verify the deployed revision
        env:
          API_URL: ${{ steps.run_deploy.outputs.api_url }}
          STREAMLIT_URL: ${{ steps.run_deploy.outputs.streamlit_url }}
        run: |
          set -euo pipefail

          health="$(curl -sS -o /dev/null -w '%{http_code}' "${API_URL}/health")"
          echo "GET /health -> ${health}"
          test "${health}" = "200"

          web="$(curl -sS -o /dev/null -w '%{http_code}' "${STREAMLIT_URL}")"
          echo "GET streamlit -> ${web}"
          test "${web}" = "200"

          # With API_KEY set as a secret, an unauthenticated caller must be turned away.
          unauth="$(curl -sS -o /dev/null -w '%{http_code}' \
            -X POST "${API_URL}/resolve" \
            -H 'Content-Type: application/json' \
            -d '{"ticket":"deployment smoke test"}')"
          echo "POST /resolve without a key -> ${unauth}"
          test "${unauth}" = "401"
