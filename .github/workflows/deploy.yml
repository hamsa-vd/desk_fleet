name: DeskFleet CI/CD

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: deskfleet-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  API_SERVICE_NAME: deskfleet-api
  MOCK_SERVICE_NAME: deskfleet-mockapi
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: ${{ secrets.GCP_REGION }}
  REPOSITORY: ${{ secrets.GCP_ARTIFACT_REGISTRY_REPOSITORY }}
  SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}
  WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
  IMAGE_ROOT: ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.GCP_ARTIFACT_REGISTRY_REPOSITORY }}

jobs:
  validate:
    name: Lint and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: python -m pip install --upgrade pip uv

      - name: Sync environment
        run: uv sync --frozen --dev

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest tests/unit tests/safety tests/prompts

  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build, push, and deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          API_KEY: ${{ secrets.API_KEY }}
          LANGCHAIN_API_KEY: ${{ secrets.LANGCHAIN_API_KEY }}
          GRAFANA_CLOUD_PROM_URL: ${{ secrets.GRAFANA_CLOUD_PROM_URL }}
          GRAFANA_CLOUD_PROM_USER: ${{ secrets.GRAFANA_CLOUD_PROM_USER }}
          GRAFANA_CLOUD_PROM_KEY: ${{ secrets.GRAFANA_CLOUD_PROM_KEY }}
        run: |
          set -euo pipefail

          sha="${GITHUB_SHA}"
          mock_image="${IMAGE_ROOT}/${MOCK_SERVICE_NAME}:${sha}"
          api_image="${IMAGE_ROOT}/${API_SERVICE_NAME}:${sha}"

          docker build -f deploy/Dockerfile.mockapi -t "${mock_image}" .
          docker push "${mock_image}"

          docker build -f deploy/Dockerfile.api -t "${api_image}" .
          docker push "${api_image}"

          gcloud run deploy "${MOCK_SERVICE_NAME}" \
            --project "${PROJECT_ID}" \
            --region "${REGION}" \
            --image "${mock_image}" \
            --service-account "${SERVICE_ACCOUNT}" \
            --allow-unauthenticated \
            --port 8081 \
            --min-instances 0 \
            --memory 512Mi \
            --timeout 300 \
            --set-env-vars "LOG_LEVEL=INFO"

          mock_url="$(gcloud run services describe "${MOCK_SERVICE_NAME}" \
            --project "${PROJECT_ID}" \
            --region "${REGION}" \
            --format='value(status.url)')"

          gcloud run deploy "${API_SERVICE_NAME}" \
            --project "${PROJECT_ID}" \
            --region "${REGION}" \
            --image "${api_image}" \
            --service-account "${SERVICE_ACCOUNT}" \
            --allow-unauthenticated \
            --port 8080 \
            --min-instances 0 \
            --memory 1Gi \
            --timeout 300 \
            --set-env-vars "ORDER_API_BASE_URL=${mock_url},PRODUCT_API_BASE_URL=${mock_url},DATABASE_URL=${DATABASE_URL},OPENAI_API_KEY=${OPENAI_API_KEY},GROQ_API_KEY=${GROQ_API_KEY},API_KEY=${API_KEY},LANGCHAIN_API_KEY=${LANGCHAIN_API_KEY},LANGCHAIN_TRACING_V2=true,LANGCHAIN_ENDPOINT=https://api.smith.langchain.com,LANGCHAIN_PROJECT=deskfleet,GRAFANA_CLOUD_PROM_URL=${GRAFANA_CLOUD_PROM_URL},GRAFANA_CLOUD_PROM_USER=${GRAFANA_CLOUD_PROM_USER},GRAFANA_CLOUD_PROM_KEY=${GRAFANA_CLOUD_PROM_KEY},LOG_LEVEL=INFO"
