# Streamlit paints the chrome it owns — widget borders, focus rings, the sidebar — before any of
# our CSS lands. Setting the palette here stops the page flashing default blue on every rerun.
[theme]
base = "light"
primaryColor = "#d9840d"
backgroundColor = "#f5f5f3"
secondaryBackgroundColor = "#ffffff"
textColor = "#121212"

[client]
toolbarMode = "minimal"

[server]
headless = true
